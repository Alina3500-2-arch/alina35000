<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Алина Шегапова — маркетинг, продвижение, шаблоны</title>
  <meta name="description" content="Канал про маркетинг, продвижение и готовые шаблоны. Забирай пользу в Telegram." />
  <style>
    :root {
      --bg: #0f1115;
      --card: #171a21;
      --accent: #2aabee;
      --accent-hover: #1e97d6;
      --text: #f4f6fb;
      --muted: #a4adbd;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: radial-gradient(120% 120% at 50% 0%, #1b2130 0%, var(--bg) 60%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      line-height: 1.5;
    }
    .card {
      background: var(--card);
      border: 1px solid rgba(255,255,255,.06);
      border-radius: 24px;
      max-width: 440px;
      width: 100%;
      padding: 36px 28px 32px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
    }
    .emoji { font-size: 52px; margin-bottom: 14px; }
    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      margin: 0 auto 18px;
      display: block;
      border: 3px solid rgba(255,255,255,.12);
      box-shadow: 0 8px 24px rgba(0,0,0,.4);
    }
    h1 { font-size: 26px; line-height: 1.2; margin-bottom: 12px; }
    .subtitle { color: var(--muted); font-size: 16px; margin-bottom: 26px; }
    .btn {
      display: block;
      width: 100%;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-size: 18px;
      font-weight: 600;
      padding: 16px;
      border-radius: 14px;
      transition: background .2s, transform .1s;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn:active { transform: scale(.98); }
    .extra {
      color: var(--muted);
      font-size: 14px;
      margin-top: 22px;
      text-align: left;
    }
    .final-cta { margin-top: 20px; font-size: 15px; font-weight: 600; color: var(--text); }
    .tg-icon { vertical-align: -3px; margin-right: 8px; }
  </style>
</head>
<body>
  <main class="card">
    <img class="avatar" src="avatar.jpg" alt="Алина Шигапова" />
    <h1>Алина Шигапова</h1>
    <p class="subtitle">
      Маркетинг, продвижение и готовые шаблоны — простыми словами и по делу.
    </p>

    <a class="btn" href="https://t.me/Alina35000" target="_blank" rel="noopener">
      <svg class="tg-icon" width="20" height="20" viewBox="0 0 24 24" fill="#fff" xmlns="http://www.w3.org/2000/svg"><path d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 13.3 3.64 12c-.88-.25-.89-.86.2-1.3l15.97-6.16c.73-.33 1.43.18 1.15 1.3l-2.72 12.81c-.19.91-.74 1.13-1.5.71L12.6 16.3l-1.99 1.93c-.23.23-.42.42-.83.42z"/></svg>
      Перейти в Telegram-канал
    </a>

    <p class="extra">
      В канале — разборы, фишки по продвижению и готовые шаблоны, которые
      можно сразу брать и использовать. Без воды и сложных терминов.
    </p>

    <p class="final-cta">Забирай пользу в Telegram 👆</p>
  </main>
</body>
</html>
